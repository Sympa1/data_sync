services:
  api:
    container_name: data-sync-api
    build:
      context: .
      dockerfile: Dockerfile
    # Die API bleibt nur im internen Compose-Netz erreichbar.
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsEndpoint: "false"
      EnableHttpsRedirection: "false"
      # Kestrel lauscht intern auf Port 8080, Caddy übernimmt HTTPS nach außen.
      ServerEndpoints__Http__Url: http://0.0.0.0:8080
      DB_PATH: /app/data/data_sync.db
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - proxy-network

  caddy:
    container_name: data-sync-caddy
    image: caddy:2
    depends_on:
      - api
    ports:
      # HTTP-Port im lokalen Netz
      - "${CADDY_HTTP_PORT:-8088}:8080"
      # HTTPS-Port im lokalen Netz
      - "${CADDY_HTTPS_PORT:-8443}:8443"
    environment:
      # Diese IP muss zur LAN-IP des Docker-Hosts passen.
      CADDY_PUBLIC_IP: ${CADDY_PUBLIC_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - proxy-network

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy-network:
